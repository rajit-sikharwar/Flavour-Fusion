<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Food | Flavour Fusion</title>
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- <link rel="stylesheet" href="./style.css"> -->
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .order-container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .form-section {
            flex: 1;
            padding: 30px;
            border-right: 1px solid #eee;
        }
        
        .payment-section {
            width: 350px;
            padding: 30px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
        }
        
        .heading {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .heading span {
            color: #ff6b6b;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .payment-methods {
            margin-top: 30px;
        }
        
        .payment-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        
        .payment-option {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #ddd;
        }
        
        .payment-option:hover {
            border-color: #ff6b6b;
        }
        
        .payment-option input {
            width: auto;
            margin-right: 15px;
        }
        
        .payment-logo {
            width: 40px;
            margin-right: 15px;
        }
        
        .payment-details {
            flex: 1;
        }
        
        .payment-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .payment-desc {
            font-size: 14px;
            color: #777;
        }
        
        .btn-order {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .btn-order:hover {
            background: #ff5252;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
        }
        
        .form-row .input-group {
            flex: 1;
        }
        
        .input-group .phone-input-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group .country-code {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 0 10px;
            height: 46px;
        }

        .input-group .country-code img {
            width: 20px;
            height: 14px;
            margin-right: 8px;
        }

        .input-group .country-code span {
            font-size: 16px;
        }

        .input-group input[type="tel"] {
            flex: 1;
            padding-left: 12px;
        }
        
        /* Food selection styles */
        .food-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .food-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .food-item:hover {
            border-color: #ff6b6b;
        }
        
        .food-item.selected {
            background-color: #ffebee;
            border-color: #ff6b6b;
        }
        
        .food-item input {
            width: auto;
            margin-right: 10px;
        }
        
        /* Order summary styles */
        .order-summary {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            border: 1px solid #eee;
        }
        
        .order-summary h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .selected-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .selected-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        
        .total-amount {
            font-weight: bold;
            font-size: 18px;
            text-align: right;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        
        .no-items {
            color: #777;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <section class="order" id="order">
        <div class="order-container">
            <!-- Left Side - Order Form -->
            <div class="form-section">
                <h1 class="heading"><span>Order</span> Now</h1>
                
                <form id="orderForm">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label for="phone">Phone Number</label>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <div style="display: flex; align-items: center; background: #f5f5f5; border: 1px solid #ddd; border-radius: 5px; padding: 0 10px; height: 46px;">
                                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/41/Flag_of_India.svg/125px-Flag_of_India.svg.png" 
                                         alt="India Flag" 
                                         style="width: 20px; height: 14px; margin-right: 8px;">
                                    <span style="font-size: 16px;">+91</span>
                                </div>
                                <input type="tel" 
                                       id="phone" 
                                       name="phone" 
                                       pattern="[0-9]{10}" 
                                       maxlength="10" 
                                       required 
                                       style="flex: 1; padding-left: 12px;"
                                       placeholder="1234567890">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="persons">Number of Persons</label>
                            <input type="number" id="persons" name="persons" min="1" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="address">Delivery Address</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="input-group">
                            <label for="postal_code">Postal Code</label>
                            <input type="text" id="postal_code" name="postal_code" maxlength="6" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>Select Your Food Items</label>
                        <div class="food-options">
                            <label class="food-item">
                                <input type="checkbox" name="food" value="Margherita Pizza" data-price="12.99">
                                Margherita Pizza - ₹12.99
                            </label>
                            <label class="food-item">
                                <input type="checkbox" name="food" value="Cheeseburger" data-price="8.99">
                                Cheeseburger - ₹8.99
                            </label>
                            <label class="food-item">
                                <input type="checkbox" name="food" value="Chicken Pasta" data-price="14.99">
                                Chicken Pasta - ₹14.99
                            </label>
                            <label class="food-item">
                                <input type="checkbox" name="food" value="Caesar Salad" data-price="9.99">
                                Caesar Salad - ₹9.99
                            </label>
                            <label class="food-item">
                                <input type="checkbox" name="food" value="Sushi Platter" data-price="18.99">
                                Sushi Platter - ₹18.99
                            </label>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="instructions">Special Instructions</label>
                        <textarea id="instructions" name="instructions"></textarea>
                    </div>
                    
                    <div class="input-group">
                        <label for="delivery_time">Preferred Delivery Time</label>
                        <input type="datetime-local" id="delivery_time" name="delivery_time" required>
                    </div>
                </form>
            </div>
            
            <!-- Right Side - Payment Options and Order Summary -->
            <div class="payment-section">
                <h2 class="payment-title">Payment Method</h2>
                
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="payment" value="cash" checked>
                        <img src="https://cdn-icons-png.flaticon.com/512/270/270848.png" alt="Cash" class="payment-logo">
                        <div class="payment-details">
                            <div class="payment-name">Cash on Delivery</div>
                            <div class="payment-desc">Pay when you receive your order</div>
                        </div>
                    </label>
                    
                    <label class="payment-option">
                        <input type="radio" name="payment" value="credit_card">
                        <img src="https://cdn-icons-png.flaticon.com/512/179/179457.png" alt="Credit Card" class="payment-logo">
                        <div class="payment-details">
                            <div class="payment-name">Credit/Debit Card</div>
                            <div class="payment-desc">Visa, Mastercard, American Express</div>
                        </div>
                    </label>
                    
                    <label class="payment-option">
                        <input type="radio" name="payment" value="paypal">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174861.png" alt="PayPal" class="payment-logo">
                        <div class="payment-details">
                            <div class="payment-name">PayPal</div>
                            <div class="payment-desc">Secure online payment</div>
                        </div>
                    </label>
                    
                    <label class="payment-option">
                        <input type="radio" name="payment" value="google_pay">
                        <img src="https://cdn-icons-png.flaticon.com/512/2504/2504739.png" alt="Google Pay" class="payment-logo">
                        <div class="payment-details">
                            <div class="payment-name">Google Pay</div>
                            <div class="payment-desc">Fast and secure</div>
                        </div>
                    </label>
                </div>
                
                <!-- Order Summary -->
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div class="selected-items" id="selectedItems">
                        <div class="no-items">No items selected</div>
                    </div>
                    <div class="total-amount" id="totalAmount">
                        Total: ₹0.00
                    </div>
                </div>
                
                <button type="button" class="btn-order" onclick="placeOrder()">Place Order Now</button>
            </div>
        </div>
    </section>

    <!-- SweetAlert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Update order summary when food items are selected
        document.querySelectorAll('.food-item input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', updateOrderSummary);
        });
        
        function updateOrderSummary() {
            const selectedItemsContainer = document.getElementById('selectedItems');
            const totalAmountElement = document.getElementById('totalAmount');
            
            // Get all selected food items
            const selectedItems = Array.from(document.querySelectorAll('.food-item input[type="checkbox"]:checked'));
            
            if (selectedItems.length === 0) {
                selectedItemsContainer.innerHTML = '<div class="no-items">No items selected</div>';
                totalAmountElement.textContent = 'Total: ₹0.00';
                return;
            }
            
            let total = 0;
            let itemsHTML = '';
            
            selectedItems.forEach(item => {
                const itemName = item.value;
                const itemPrice = parseFloat(item.dataset.price);
                total += itemPrice;
                
                itemsHTML += `
                    <div class="selected-item">
                        <span>${itemName}</span>
                        <span>₹${itemPrice.toFixed(2)}</span>
                    </div>
                `;
            });
            
            selectedItemsContainer.innerHTML = itemsHTML;
            totalAmountElement.textContent = `Total: ₹${total.toFixed(2)}`;
        }
        
        function placeOrder() {
            // Validate form
            const form = document.getElementById('orderForm');
            const selectedItems = Array.from(document.querySelectorAll('.food-item input[type="checkbox"]:checked'));
            
            if (!form.checkValidity()) {
                Swal.fire({
                    title: 'Oops...',
                    text: 'Please fill in all required fields!',
                    icon: 'error'
                });
                return;
            }
            
            if (selectedItems.length === 0) {
                Swal.fire({
                    title: 'Oops...',
                    text: 'Please select at least one food item!',
                    icon: 'error'
                });
                return;
            }
            
            // Get order details for confirmation
            const orderDetails = selectedItems.map(item => {
                return `${item.value} (₹${item.dataset.price})`;
            }).join('\n');
            
            const totalAmount = selectedItems.reduce((sum, item) => sum + parseFloat(item.dataset.price), 0);
            
            // Show order confirmation
            Swal.fire({
                title: 'Confirm Your Order',
                html: `<strong>Selected Items:</strong><br>${orderDetails.replace(/\n/g, '<br>')}<br><br>
                      <strong>Total Amount:</strong> ₹${totalAmount.toFixed(2)}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Confirm Order',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    // If confirmed, show success message
                    Swal.fire({
                        title: 'Order Placed!',
                        text: 'Your order has been placed successfully!',
                        icon: 'success',
                        confirmButtonText: 'Great!'
                    }).then(() => {
                        // Reset form after successful order
                        form.reset();
                        document.querySelector('input[name="payment"][value="cash"]').checked = true;
                        // Clear selected items
                        document.querySelectorAll('.food-item input[type="checkbox"]').forEach(checkbox => {
                            checkbox.checked = false;
                        });
                        updateOrderSummary();
                    });
                }
            });
        }
    </script>
</body>
</html>
